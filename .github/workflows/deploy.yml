name: النشر والتحقق في الإنتاج

# يتحقق من الجودة، يحاول النشر على Railway عند توفّر الرمز المميز، ثم يفحص الموقع الحيّ
# عقد الفحوص في scripts/verify-deployment.mjs ولا يحتاج أي صلاحية على Railway.
#
# نسخة pnpm تُقرأ من حقل packageManager في package.json؛ لا تُضِف input باسم version
# وإلا يفشل pnpm/action-setup برسالة "Multiple versions of pnpm specified".
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'verification/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'تحقق من الإنتاج الحالي دون محاولة نشر'
        type: boolean
        default: false
      deploy_only:
        description: 'نشر فقط (تخطّي بوابة الجودة والتحقق) لأغراض تشخيصية أو إعادة نشر طارئة'
        type: boolean
        default: false

concurrency:
  # طلبات الدمج لا تصطفّ خلف نشر الإنتاج؛ والنشر يبقى أحاديًا دائمًا.
  group: ${{ github.event_name == 'pull_request' && github.ref || 'production-deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # NEXT_PUBLIC_SITE_URL تُدمج وقت البناء؛ البديل الافتراضي هو نطاق الإنتاج الحالي.
  NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_URL || 'https://yemreact-production.up.railway.app' }}
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://yemreact-production.up.railway.app' }}
  FFPROBE_PATH: /usr/bin/ffprobe
  FFMPEG_PATH: /usr/bin/ffmpeg

jobs:
  quality:
    name: فحوص الجودة والبناء
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.verify_only != true && inputs.deploy_only != true) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: تثبيت FFmpeg (التحقق من الوسائط وبناء الغلاف)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile
      - name: فحص TypeScript
        run: pnpm typecheck
      - name: تنسيق الكود
        run: pnpm format:check
      - name: اختبارات المنطق
        run: pnpm test
      - name: بناء الإنتاج بنفس أمر الحاوية
        run: pnpm build

  deploy:
    name: النشر على Railway
    needs: quality
    # لا نشر من طلبات الدمج، ولا من «تحقق فقط». بوابة الجودة تتخطّاها «نشر فقط» فقط.
    if: ${{ always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.verify_only != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # يُبلَّغ عن نتيجة خطوة CLI ليعرف التحقق كم ينتظر (فشل CLI ⇒ انتظار قصير).
      cli: ${{ steps.railway.outcome }}
      # مرجعية زمنية: نشرة رُفعت بـCLI لا تحمل التزامًا، فيُقاس تجدّدها من هذا الوقت.
      deployed_at: ${{ steps.railway.outputs.deployed_at }}
    steps:
      - uses: actions/checkout@v7
      - name: نشر عبر Railway CLI
        id: railway
        # بلا RAILWAY_TOKEN يُتخطّى النشر؛ إن كان تكامل GitHub مفعّلًا في Railway فالنشر
        # يتم تلقائيًا، ووظيفة التحقق التالية هي الحكم النهائي.
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::notice title=تخطّي نشر CLI::لا يوجد RAILWAY_TOKEN في أسرار المستودع. إن كان تكامل GitHub مفعّلًا في Railway فالنشر يتم تلقائيًا من الفرع main، وستتحقق الوظيفة التالية من النتيجة."
            exit 0
          fi
          # اسم الخدمة: من السر إن وُجد، وإلا نستنتجه من نفس الرمز المميز — نستعمله فقط
          # إذا كانت الخدمة وحيدة بلا لبس، وإلا نتوقف برسالة تسمّي المرشّحين.
          service="${RAILWAY_SERVICE:-}"
          if [ -z "$service" ]; then
            svc_list="$(npx --yes @railway/cli@latest status --json 2>/dev/null |
              jq -r 'def items(x): ((x | if type == "object" and has("edges") then .edges else . end) // []) | map(.node // .); items(.services)[] | select(.name) | .name' 2>/dev/null |
              sed '/^[[:space:]]*$/d' | sort -u | head -10)"
            svc_count="$(printf '%s\n' "$svc_list" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
            if [ "$svc_count" = "1" ]; then
              service="$(printf '%s\n' "$svc_list" | sed '/^[[:space:]]*$/d' | head -1)"
              echo "::notice title=خدمة مستنتجة::لم يُضبط RAILWAY_SERVICE؛ استُنتجت الخدمة الوحيدة في المشروع: $service"
            elif [ "$svc_count" -gt 1 ]; then
              echo "::error title=حدّد الخدمة::المشروع يحوي عدة خدمات: $(printf '%s' "$svc_list" | tr '\n' ' ') — أضف الاسم الصحيح في السر RAILWAY_SERVICE ثم أعد التشغيل."
              exit 1
            fi
          fi
          args=(up --ci)
          if [ -n "${RAILWAY_PROJECT_ID:-}" ]; then args+=(--project "$RAILWAY_PROJECT_ID"); fi
          if [ -n "${RAILWAY_ENVIRONMENT_ID:-}" ]; then args+=(--environment "$RAILWAY_ENVIRONMENT_ID"); fi
          if [ -n "$service" ]; then args+=(--service "$service"); fi
          echo "تشغيل: npx --yes @railway/cli@latest ${args[*]}"
          # نلتقط الخرج في ملف: سجل GitHub Actions هنا غير قابل للقراءة عبر الواجهة،
          # فيُصدر الفشل كتنبيه (annotation) يقرأه المشغّل وأداة المتابعة مباشرة.
          # مرجعية زمنية تُمرَّر لوظيفة التحقق: النشرة المرفوعة لا تحمل التزامًا،
          # فيُتحقق من أن الحاوية بدأت بعد هذا الوقت (مع هامش للبناء والبدء).
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          out="$(mktemp)"
          if npx --yes @railway/cli@latest "${args[@]}" 2>&1 | tee "$out"; then
            echo "::notice title=نشر CLI::أُرسلت النشرة عبر Railway CLI"
          else
            # سجل هذه الوظيفة غير قابل للقراءة من خارج الواجهة، فيُصدر السبب كتنبيه:
            # نجرّد أكواد ANSI، ثم نفضّل الأسطر التي تحمل خطأً حقيقيًا على ضجيج npm.
            clean="$(sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' -e 's/\r/\n/g' "$out")"
            detail="$(printf '%s\n' "$clean" | grep -iE 'error|unauthor|forbidden|invalid|denied|not found|missing|fail|link|service|project|token|401|403|404' | tail -n 6 | tr '\n\r' '  ' | tail -c 1500)"
            if [ -z "${detail// /}" ]; then
              detail="$(printf '%s\n' "$clean" | tail -n 5 | tr '\n\r' '  ' | tail -c 1500)"
            fi
            echo "::error title=فشل Railway CLI::${detail:-خرج CLI بفشل دون رسالة}"
            # المشروع قد يحوي أكثر من خدمة؛ نستخرج الأسماء المرشّحة من نفس الرمز المميز
            # ليعرف المشغّل ما يضعه في السر RAILWAY_SERVICE دون تخمين.
            if printf '%s' "$clean" | grep -qi 'multiple services'; then
              candidates="$(npx --yes @railway/cli@latest status --json 2>/dev/null |
                jq -r 'def items(x): ((x | if type == "object" and has("edges") then .edges else . end) // []) | map(.node // .); [items(.services)[] | select(.name) | .name] | unique | join(" · ")' 2>/dev/null |
                head -c 300)"
              if [ -n "${candidates// /}" ]; then
                echo "::warning title=حدّد الخدمة::المشروع يحوي أكثر من خدمة. المرشّحون: $candidates — أضف الاسم الصحيح في السر RAILWAY_SERVICE ثم أعد التشغيل."
              else
                echo "::warning title=حدّد الخدمة::المشروع يحوي أكثر من خدمة وتعذّر سرد الأسماء بالرمز الحالي. افتح لوحة Railway واقرأ اسم الخدمة ثم أضفه في السر RAILWAY_SERVICE."
              fi
            fi
            exit 1
          fi
      - name: تنبيه عند فشل النشر عبر CLI
        if: ${{ steps.railway.outcome == 'failure' }}
        run: |
          {
            echo "### فشل النشر عبر Railway CLI"
            echo ""
            echo "الأسباب الشائعة بالترتيب:"
            echo "1. الرمز المميز مشروع لكن من بيئة أخرى، أو أُبطل أو دوّر."
            echo "2. الرمز غير صالح كرمز مشروع (Personal token لا يعمل مع up --ci بنفس الطريقة) — أنشئ الرمز من Settings → Tokens ببيئة production."
            echo "3. الخدمة غير مرتبطة: أضف RAILWAY_SERVICE باسم الخدمة، وRAILWAY_PROJECT_ID وRAILWAY_ENVIRONMENT_ID."
            echo ""
            echo "اقرأ سبب CLI الحقيقي في تنبيه (annotation) الخطوة السابقة، أو شغّل هذا السير العمل بمدخل «نشر فقط» لتشخيص أسرع."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: التحقق من الإنتاج
    needs: [quality, deploy]
    # فقط على الدفع/التشغيل اليدوي؛ لا معنى لفحص الإنتاج من طلب دمج.
    if: ${{ always() && needs.quality.result == 'success' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy_only != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: انتظار النشرة ثم تنفيذ عقد الفحوص
        env:
          # عند «تحقق فقط» لا ننتظر إصدارًا جديدًا، بل نفحص ما هو منشور الآن.
          WAIT_FOR_REVISION: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
          # فشل CLI يعني أن نشرة جديدة غير مرتقبة قريبًا: انتظار قصير مع رسالة واضحة
          # خير من خمس عشرة دقيقة بلا فائدة. غيّر الرقم من متغيّر المستودع عند الحاجة.
          WAIT_SECONDS: ${{ needs.deploy.outputs.cli == 'failure' && (vars.VERIFY_WAIT_AFTER_FAILURE || '300') || '900' }}
        run: |
          set -euo pipefail
          echo "مهلة انتظار النشرة: ${WAIT_SECONDS} ثانية"
          args=("$PRODUCTION_URL" --wait "$WAIT_SECONDS" --poll 15 --json verification/deployment/result.json)
          if [ "$WAIT_FOR_REVISION" = "true" ]; then
            args+=(--expect-revision "$GITHUB_SHA")
            if [ -n "${{ needs.deploy.outputs.deployed_at }}" ]; then
              args+=(--deployed-at "${{ needs.deploy.outputs.deployed_at }}")
            fi
          fi
          node scripts/verify-deployment.mjs "${args[@]}"
      - name: حفظ تقرير التحقق
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-verification
          path: verification/deployment/result.json
          if-no-files-found: ignore
          retention-days: 30
