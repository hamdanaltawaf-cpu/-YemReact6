name: النشر والتحقق في المعاينة

# يتحقق من الجودة، ثم يفحص معاينة Render التجريبية على عنوانها؛ عناوين وعقود
# الفحوص في scripts/verify-deployment.mjs ولا يحتاج أي صلاحية على Render.
# لا ينشر هذا السير على أي منصة؛ Render ينشر تلقائيًا خارج هذا السير.
#
# نسخة pnpm تُقرأ من حقل packageManager في package.json؛ لا تُضِف input باسم version
# وإلا يفشل pnpm/action-setup برسالة "Multiple versions of pnpm specified".
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'verification/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'تحقق من معاينة Render الحالية دون محاولة نشر'
        type: boolean
        default: false

concurrency:
  # طلبات الدمج لا تصطفّ خلف نشر المعاينة؛ والنشر يبقى أحاديًا دائمًا.
  group: ${{ github.event_name == 'pull_request' && github.ref || 'preview-deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # المصدر الوحيد لعنوان المعاينة التجريبية: أولوية لمتغيّر المستودع PREVIEW_BASE_URL،
  # ثم البديل الثابت أدناه (معاينة Render). الفحوص والبناء يقرآنه ولا يكرّرانه.
  PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL || 'https://yemreact-preview.onrender.com' }}
  FFPROBE_PATH: /usr/bin/ffprobe
  FFMPEG_PATH: /usr/bin/ffmpeg

jobs:
  quality:
    name: فحوص الجودة والبناء
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: تثبيت FFmpeg (التحقق من الوسائط وبناء الغلاف)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile
      - name: فحص TypeScript
        run: pnpm typecheck
      - name: تنسيق الكود
        run: pnpm format:check
      - name: اختبارات المنطق
        run: pnpm test
      - name: بناء الإنتاج بنفس أمر الحاوية
        env:
          # أولوية الفرض اليدوي عبر متغيّر المستودع NEXT_PUBLIC_SITE_URL؛ وإلا عنوان المعاينة الموحّد.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || '' }}
        run: NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-$PREVIEW_BASE_URL}" pnpm build

  verify:
    name: التحقق من معاينة Render
    needs: [quality]
    # فقط على الدفع/التشغيل اليدوي؛ لا معنى لفحص المعاينة من طلب دمج.
    if: ${{ always() && !cancelled() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: إيقاظ المعاينة ثم انتظار النشرة ثم تنفيذ عقد الفحوص
        env:
          # عند «تحقق فقط» لا ننتظر إصدارًا جديدًا، بل نفحص ما هو منشور الآن.
          WAIT_FOR_REVISION: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
          WAIT_SECONDS: ${{ vars.VERIFY_WAIT_SECONDS || '900' }}
        run: |
          set -euo pipefail
          echo "مهلة انتظار النشرة: ${WAIT_SECONDS} ثانية — مهلة إيقاظ المعاينة: 180 ثانية"
          args=(
            "$PREVIEW_BASE_URL"
            --wait "$WAIT_SECONDS"
            --poll 15
            # Render المجاني ينام بعد الخمول: إحماء مقيَّد وواضح قبل الفحوص،
            # وعند انتهائه تعرض الفحوص الخطأ الحقيقي لكل مسار (لا تجاوز).
            --warm 180
            --json verification/deployment/result.json
          )
          if [ "$WAIT_FOR_REVISION" = "true" ]; then
            args+=(--expect-revision "$GITHUB_SHA")
          fi
          node scripts/verify-deployment.mjs "${args[@]}"
      - name: حفظ تقرير التحقق
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: render-preview-verification
          path: verification/deployment/result.json
          if-no-files-found: ignore
          retention-days: 30
